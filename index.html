<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f5d45">
<title>対応マニュアル｜緊急・災害／権利・福祉</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f3f5f1; --card:#ffffff; --ink:#1e2a24; --muted:#5c6b62;
    --line:#e0e6e0; --field:#2f5d45; --leaf:#3c8c5f; --leaf-weak:#e7f1ea;
    --danger:#bb3b2c; --danger-bg:#fbeae7;
    --warn:#a5720f;   --warn-bg:#fbf0dd;
    --ok:#2e7d52;     --ok-bg:#e7f3ec;
    --info:#38617d;   --info-bg:#e7eef3;
    --r:16px; --shadow:0 1px 2px rgba(30,42,36,.05),0 8px 24px rgba(30,42,36,.05);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#12160f; --card:#1a1f18; --ink:#e8ede7; --muted:#98a69c;
    --line:#2a3128; --field:#8fbfa2; --leaf:#6cbb8b; --leaf-weak:#1c2a22;
    --danger:#f18c7f; --danger-bg:#3a201d;
    --warn:#e6b466;   --warn-bg:#38290f;
    --ok:#74c99a;     --ok-bg:#16281f;
    --info:#8db8d4;   --info-bg:#182a35;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  }}
  :root[data-theme="dark"]{
    --paper:#12160f; --card:#1a1f18; --ink:#e8ede7; --muted:#98a69c; --line:#2a3128;
    --field:#8fbfa2; --leaf:#6cbb8b; --leaf-weak:#1c2a22;
    --danger:#f18c7f; --danger-bg:#3a201d; --warn:#e6b466; --warn-bg:#38290f;
    --ok:#74c99a; --ok-bg:#16281f; --info:#8db8d4; --info-bg:#182a35;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    line-height:1.7; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--leaf)}
  .wrap{max-width:640px;margin:0 auto;padding:0 15px 60px}

  /* brand header */
  .brand{display:flex;align-items:center;gap:11px;padding:18px 2px 14px}
  .brand .mark{
    width:38px;height:38px;flex:none;border-radius:11px;background:var(--field);
    display:grid;place-items:center;font-size:1.2rem;
  }
  .brand .bname{font-weight:800;font-size:1.14rem;letter-spacing:.04em;line-height:1.2}
  .brand .bsub{font-size:.78rem;color:var(--muted);letter-spacing:.14em}

  /* call-first bar */
  .callbar{
    display:flex;align-items:center;gap:10px;
    background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 26%,transparent);
    color:var(--danger);border-radius:12px;padding:11px 13px;margin-bottom:20px;font-size:.86rem;
  }
  .callbar .lead{font-weight:600}
  .callbar .nums{margin-left:auto;display:flex;gap:8px}
  .callbar a{
    color:#fff;background:var(--danger);text-decoration:none;font-weight:700;
    border-radius:9px;padding:5px 12px;font-size:.92rem;letter-spacing:.03em;
  }

  /* section */
  .section{display:flex;align-items:center;gap:8px;margin:6px 2px 10px;font-size:.82rem;font-weight:700;color:var(--muted)}
  .section::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--leaf)}
  .section:not(:first-of-type){margin-top:22px}

  /* tiles */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  @media(max-width:360px){.grid{grid-template-columns:1fr}}
  .tile{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 13px 14px;text-align:left;cursor:pointer;color:inherit;
    display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s;
  }
  .tile:hover{border-color:var(--leaf);background:var(--leaf-weak)}
  .tile .ico{font-size:1.45rem;line-height:1;margin-bottom:2px}
  .tile .t{font-weight:700;font-size:1rem}
  .tile .d{font-size:.78rem;color:var(--muted);line-height:1.5}

  /* flow header */
  .flowbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
  .ghost{background:none;border:none;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;padding:6px 4px;border-radius:8px}
  .ghost:hover{color:var(--ink)}
  .cathead{display:flex;align-items:center;gap:9px;margin:2px 2px 14px}
  .cathead .ci{font-size:1.3rem}
  .cathead .ct{font-weight:800;font-size:1.06rem}
  .cathead .step{margin-left:auto;font-size:.76rem;color:var(--muted);background:var(--leaf-weak);border-radius:20px;padding:3px 11px}

  /* question */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px}
  .qtext{white-space:pre-wrap;margin:0 0 15px;font-size:1.04rem;line-height:1.75}
  .options{display:flex;flex-direction:column;gap:9px}
  .opt{
    width:100%;text-align:left;background:var(--card);color:inherit;
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:1rem;
    cursor:pointer;transition:background .12s,border-color .12s;display:flex;align-items:center;gap:9px;
  }
  .opt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:none;opacity:.55}
  .opt:hover{border-color:var(--leaf);background:var(--leaf-weak)}
  .opt:hover::before{opacity:1}

  /* 合言葉ゲート */
  .lockhint{font-weight:600;color:var(--muted);font-size:.74rem;margin-left:2px}
  .gate{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;text-align:center}
  .gate .lock{font-size:1.8rem}
  .gate h2{font-size:1.02rem;margin:8px 0 4px}
  .gate p{font-size:.86rem;color:var(--muted);margin:0 0 16px}
  .gate input{width:100%;font:inherit;font-size:1rem;text-align:center;letter-spacing:.1em;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:inherit}
  .gate .err{color:var(--danger);font-size:.82rem;min-height:1.2em;margin:8px 0 0}

  /* result */
  .answers{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  .answers li{font-size:.82rem;color:var(--muted);display:flex;gap:7px}
  .answers li b{color:var(--ink);font-weight:600;flex:none}
  .result{white-space:pre-wrap;border-radius:var(--r);padding:16px;border:1px solid transparent;font-size:1.02rem;line-height:1.8}
  .result .rlead{display:block;font-weight:800;font-size:.8rem;letter-spacing:.06em;margin-bottom:8px;opacity:.85}
  .result.danger{background:var(--danger-bg);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 28%,transparent)}
  .result.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
  .result.ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
  .result.info{background:var(--info-bg);color:var(--info);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
  .result a.tel{color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px}

  .actions{display:flex;gap:9px;margin-top:16px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:12px;padding:12px;font:inherit;font-size:.94rem;cursor:pointer;text-align:center}
  .btn:hover{border-color:var(--leaf)}
  .btn.primary{background:var(--field);border-color:var(--field);color:#fff}

  footer.app{color:var(--muted);font-size:.75rem;margin-top:26px;border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
  footer.app code{background:var(--leaf-weak);padding:1px 5px;border-radius:5px}

  :focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <span class="mark">🧭</span>
    <div>
      <!-- 事業所名を入れる場合は bname を書き換えてください（例：〇〇事業所） -->
      <div class="bname">対応マニュアル</div>
      <div class="bsub">緊急・災害／権利・福祉</div>
    </div>
  </header>

  <div id="view"></div>

  <footer class="app">
    生命に関わる緊急時は、まず電話（119／110）で通報してください。この手引きは対応の目安です。<br>
    各窓口・連絡先は仮の表記です。実際の担当者・番号に置き換えてご利用ください（コード内 <code>CONTACTS</code>）。
  </footer>
</div>

<script>
/* =========================================================
   連絡先（テンプレート。実際の値に編集してください）
========================================================= */
const CONTACTS = {
  人権110番:       "みんなの人権110番（法務省）0570-003-110",
  総合労働相談:    "総合労働相談コーナー（各都道府県労働局・無料・秘密厳守）",
  警察:            "緊急は110／緊急でない相談は #9110",
  児童相談所:      "児童相談所虐待対応ダイヤル 189（いちはやく）",
  虐待防止センター:"市町村の障害者虐待防止センター（連絡先を設定してください）",
  苦情受付担当:    "苦情受付担当者（設定してください）",
  苦情解決責任者:  "苦情解決責任者（設定してください）",
  第三者委員:      "苦情解決の第三者委員（設定してください）",
  運営適正化委員会:"都道府県社協 運営適正化委員会（設定してください）"
};

/* =========================================================
   メニュー（2グループ・10項目）
========================================================= */
const MENU = [
  {group:"緊急・災害", icon:"🤕", title:"ケガ・病人",   desc:"応急対応の手順",       to:"injury_start"},
  {group:"緊急・災害", icon:"🌞", title:"熱中症",       desc:"疑われるときの対応",   to:"heat_env"},
  {group:"緊急・災害", icon:"🔥", title:"火災",         desc:"発生時の対応",         to:"fire_scale"},
  {group:"緊急・災害", icon:"🌐", title:"地震",         desc:"発生時の対応",         to:"quake_damage"},
  {group:"緊急・災害", icon:"🤒", title:"体調報告",     desc:"発熱・体調不良の報告", to:"health_temp"},
  {group:"権利・福祉", icon:"🛡", title:"ハラスメント", desc:"セクハラ・パワハラ等", to:"har_type"},
  {group:"権利・福祉", icon:"🧑‍💼", title:"カスハラ",   desc:"顧客の迷惑・威圧行為", to:"cust_screen"},
  {group:"権利・福祉", icon:"🕊", title:"虐待",         desc:"発見・疑いの通報",     to:"abuse_target"},
  {group:"権利・福祉", icon:"🔒", title:"身体拘束",     desc:"適正手続きの確認",     to:"rs_urgency"},
  {group:"権利・福祉", icon:"💬", title:"苦情解決",     desc:"苦情・ご意見の受付",   to:"comp_reporter"}
];

/* =========================================================
   合言葉ゲート（権利・福祉の項目に入る前の軽い仕切り）
   ※ 静的HTMLのためソースを見れば分かります。部外者を確実に締め出す鍵ではなく、
     関係者向けの「うっかり閲覧」防止です。事業所ごとに PASSPHRASE を変更してください。
========================================================= */
const PROTECTED_GROUP = "権利・福祉";
const PASSPHRASE = "0000";           // ← 事業所ごとに変更してください
let unlocked = (function(){ try{ return sessionStorage.getItem("rw_unlocked")==="1"; }catch(e){ return false; } })();
let pendingFlow = null;

/* =========================================================
   フロー定義（ボットの分岐・文言に準拠）
   question：{q, options:[{label,to,set}]}   result：{result:true, text, tone}
   {{key}} は CTX または CONTACTS で置換
========================================================= */
const NODES = {
  /* ---- ケガ・病人 ---- */
  injury_start:{q:"🩸 出血はありますか？程度も教えてください。",options:[
    {label:"なし",to:"injury_consc"},{label:"少量",to:"injury_consc"},{label:"大量",to:"injury_consc_heavy"}]},
  injury_consc:{q:"⚠️ 意識の状態を教えてください。",options:[
    {label:"はっきりしている",to:"injury_part"},{label:"もうろう",to:"injury_mouro"},{label:"反応なし",to:"injury_none"}]},
  injury_consc_heavy:{q:"🔴 大量出血です。清潔な布で強く圧迫止血し、可能なら患部を心臓より高く保ってください。\n\n⚠️ 意識の状態を教えてください。",options:[
    {label:"はっきりしている",to:"injury_part"},{label:"もうろう",to:"injury_mouro"},{label:"反応なし",to:"injury_none"}]},
  injury_none:{result:true,tone:"danger",text:"🚑 直ちに119番通報してください。呼吸を確認し、なければ胸骨圧迫を。周囲に応援を求めてください。"},
  injury_mouro:{result:true,tone:"danger",text:"⚠️ 意識がもうろうとしています。危険なサインです。横向きに寝かせ、直ちに119番通報を検討してください。"},
  injury_part:{q:"🩻 主にどこを負傷しましたか？",options:[
    {label:"頭・首",to:"injury_sym_head"},{label:"胸・腹・背",to:"injury_sym_chest"},{label:"手足",to:"injury_sym"},{label:"その他",to:"injury_sym"}]},
  injury_sym_head:{q:"🧠 頭部・頚部は不用意に動かさないでください。しびれ・嘔吐・意識変化があれば救急要請を。\n\n⚠️ 具体的な状態を選んでください。",options:injuryStates()},
  injury_sym_chest:{q:"🫁 呼吸苦や強い痛みがあれば無理に動かさず救急要請を。\n\n⚠️ 具体的な状態を選んでください。",options:injuryStates()},
  injury_sym:{q:"⚠️ 具体的な状態を選んでください。",options:injuryStates()},
  injury_i_ko:{q:"🩸 圧迫止血し、👁️ 経過観察してください。\n\n👁️ その後の経過を教えてください。",options:injuryObs()},
  injury_i_daboku:{q:"❄️ 冷却し、👁️ 経過を見てください。腫れが強い場合は受診を。\n\n👁️ その後の経過を教えてください。",options:injuryObs()},
  injury_i_taicho:{q:"🛌 安静にし、改善がなければ🏥 医療機関へ。\n\n👁️ その後の経過を教えてください。",options:injuryObs()},
  injury_i_yakedo:{q:"🚿 すぐ流水で15分以上冷やしてください。広範囲・水ぶくれは受診を。\n\n👁️ その後の経過を教えてください。",options:injuryObs()},
  injury_i_kossetsu:{q:"🏥 動かさず固定し、医療機関へ。強い変形・出血は救急要請を。\n\n👁️ その後の経過を教えてください。",options:injuryObs()},
  injury_i_oto:{q:"💧 少量ずつ水分補給し、脱水・血便があれば受診を。\n\n👁️ その後の経過を教えてください。",options:injuryObs()},
  injury_i_atama:{q:"✅ 意識・嘔吐・言動を観察。異常があれば🏥 受診してください。\n\n👁️ その後の経過を教えてください。",options:injuryObs()},
  injury_r_kaizen:{result:true,tone:"ok",text:"✅ 改善が見られます。引き続き無理せず様子を見てください。"},
  injury_r_henka:{result:true,tone:"warn",text:"⌛ 観察を継続し、変化があれば医療機関・家族へ連絡を。"},
  injury_r_akka:{result:true,tone:"danger",text:"⚠️ 悪化しています。📞 119番通報を検討してください。"},

  /* ---- 熱中症 ---- */
  heat_env:{q:"🌡 まず涼しい場所へ移動してください。どこで発症しましたか？",options:[
    {label:"屋外（直射日光）",to:"heat_symptom"},{label:"屋内",to:"heat_symptom"}]},
  heat_symptom:{q:"⚠️ 症状はどれに近いですか？",options:[
    {label:"めまい・立ちくらみ",to:"heat_consc"},{label:"頭痛・吐き気・大量発汗",to:"heat_consc"},{label:"けいれん・反応薄い",to:"heat_consc_sev"}]},
  heat_consc:{q:"🚿 体を冷やし、衣服を緩めてください。\n\n🧠 意識・呼びかけへの反応はどうですか？",options:[
    {label:"はっきり反応する",to:"heat_hyd"},{label:"反応が鈍い/ない",to:"heat_r_emg"}]},
  heat_consc_sev:{q:"🚿 首・脇・脚の付け根を冷やしながら確認してください。\n\n🧠 意識・呼びかけへの反応はどうですか？",options:[
    {label:"はっきり反応する",to:"heat_hyd_sev"},{label:"反応が鈍い/ない",to:"heat_r_emg"}]},
  heat_hyd:{q:"🧴 自分で水分・塩分を摂取できますか？",options:[
    {label:"摂取できる",to:"heat_r_ok"},{label:"摂取できない",to:"heat_r_trans"}]},
  heat_hyd_sev:{q:"🧴 自分で水分・塩分を摂取できますか？",options:[
    {label:"摂取できる",to:"heat_r_ok_sev"},{label:"摂取できない",to:"heat_r_trans"}]},
  heat_r_emg:{result:true,tone:"danger",text:"🚑 直ちに119番通報してください。冷却を続けながら救急を待ちます。自力での水分摂取はさせないでください。"},
  heat_r_trans:{result:true,tone:"danger",text:"🚑 自力で水分が摂れない場合は搬送が必要です。医療機関へ連れて行くか救急要請してください。"},
  heat_r_ok:{result:true,tone:"ok",text:"💧 涼所で水分・塩分を補給し、30分ほど様子を見てください。改善しなければ受診を。"},
  heat_r_ok_sev:{result:true,tone:"warn",text:"💧 涼所で水分・塩分を補給し、30分ほど様子を見てください。\n⚠️ 重度症状がみられました。改善しなければ早めに受診してください。"},

  /* ---- 火災 ---- */
  fire_scale:{q:"🔥 火災の規模を教えてください。",options:[
    {label:"小（初期）",to:"fire_smoke"},{label:"中",to:"fire_smoke"},{label:"大（延焼）",to:"fire_big"}]},
  fire_smoke:{q:"💨 煙の状況は？",options:[
    {label:"少ない",to:"fire_source"},{label:"充満している",to:"fire_big"}]},
  fire_big:{q:"🚨 延焼・煙充満の危険があります。消火は試みず、姿勢を低くして直ちに避難してください。\n\n📞 119番通報の状況は？",options:[
    {label:"済み",to:"fire_evac"},{label:"これから",to:"fire_evac_now"}]},
  fire_source:{q:"🔎 火元は何ですか？",options:[
    {label:"電気系統",to:"fire_ext_denki"},{label:"油",to:"fire_ext_abura"},{label:"その他",to:"fire_ext"}]},
  fire_ext:{q:"🧯 消火器は使えますか？",options:[
    {label:"使える",to:"fire_call"},{label:"ない",to:"fire_call"},{label:"届かない/危険",to:"fire_call"}]},
  fire_ext_denki:{q:"⚠️ 感電に注意。可能ならブレーカーを落としてください。\n\n🧯 消火器は使えますか？",options:[
    {label:"使える",to:"fire_call"},{label:"ない",to:"fire_call"},{label:"届かない/危険",to:"fire_call"}]},
  fire_ext_abura:{q:"⚠️ 油火災に水は厳禁です。消火器か鍋のフタ等で覆って消火を。\n\n🧯 消火器は使えますか？",options:[
    {label:"使える",to:"fire_call"},{label:"ない",to:"fire_call"},{label:"届かない/危険",to:"fire_call"}]},

    let text="📝 記録項目：態様／時間／その際の心身の状況／緊急やむを得ない理由。\n🔓 拘束は最短で解除し、解消に向けた見直し（要件の再確認）を継続してください。";

    if(pending.length) text="⚠️ 未了の手続きがあります："+pending.join("、")+"。実施前に必ず完了してください。\n\n"+text;
    return {text, tone: pending.length?"warn":"ok"};

};

function tmpl(t){
  if(!t) return t;
  return t.replace(/\{\{(.+?)\}\}/g,(m,k)=>{
    if(currentCtx()[k]!=null) return tmpl(currentCtx()[k]);
    if(CONTACTS[k]!=null) return CONTACTS[k];
    return "";
  });
}
function currentCtx(){ return stack.length? stack[stack.length-1].ctx : {}; }

/* 電話番号をタップ発信リンクに（名称内の番号は誤発信防止で除外） */
function linkifyPhones(html){
  html=html.replace(/0570-003-110/g, tel("0570003110","0570-003-110"));
  html=html.replace(/人権110番/g, "人権11\u00010番");        // 名称内の 110 を保護
  html=html.replace(/119番/g, tel("119","119番"));
  html=html.replace(/110番/g, tel("110","110番"));
  html=html.replace(/#9110/g, tel("9110","#9110"));
  html=html.replace(/189（/g, tel("189","189")+"（");
  return html.replace(/\u0001/g,"");                         // 保護解除
}
function tel(num,label){ return '<a class="tel" href="tel:'+num+'">'+label+'</a>'; }

      html+='<div class="section">'+m.group+hint+'</div><div class="grid">'; cur=m.group; }
    html+='<button class="tile" onclick="startFlow('+i+')">'
      +'<span class="ico">'+m.icon+'</span><span class="t">'+m.title+'</span><span class="d">'+m.desc+'</span></button>';
  });
  html+='</div>';
  view.innerHTML=html;
  window.scrollTo(0,0);
}

function startFlow(i){
  const m=MENU[i];
  if(m.group===PROTECTED_GROUP && !unlocked){ pendingFlow=i; return renderGate(""); }
  cat=m;
  stack=[{id:cat.to, ctx:{}}]; answers=[];
  renderNode(cat.to);
}

function renderGate(err){
  view.innerHTML=
    '<div class="flowbar"><button class="ghost" onclick="showMenu()">← メニュー</button></div>'
    +'<div class="gate"><div class="lock">🔒</div>'
    +'<h2>権利・福祉の項目</h2>'
    +'<p>関係者向けの内容です。合言葉を入力してください。</p>'
    +'<input id="pass" type="password" inputmode="text" autocomplete="off" '
    +'placeholder="合言葉" onkeydown="if(event.key===\'Enter\')tryUnlock()">'
    +'<p class="err">'+esc(err||"")+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="tryUnlock()">開く</button></div></div>';
  const el=document.getElementById("pass"); if(el) el.focus();
  window.scrollTo(0,0);
}

function tryUnlock(){
  const el=document.getElementById("pass");
  const val=el ? el.value : "";
  if(val===PASSPHRASE){
    unlocked=true;
    try{ sessionStorage.setItem("rw_unlocked","1"); }catch(e){}
    const i=pendingFlow; pendingFlow=null;
    startFlow(i);
  }else{
    renderGate("合言葉が違います。もう一度お試しください。");
  }
}

function choose(idx){
  const node=NODES[stack[stack.length-1].id];
  const opt=node.options[idx];
  answers.push({q:shorten(node.q), a:opt.label});
  stack.push({id:opt.to, ctx:Object.assign({}, currentCtx(), opt.set||{})});
  renderNode(opt.to);
}

function back(){
  if(stack.length<=1){ showMenu(); return; }
  stack.pop(); answers.pop();
  renderNode(stack[stack.length-1].id);
}

function shorten(q){ return (q.split("\n").pop()||q).replace(/^[【\s]*/,"").slice(0,22); }

function flowbar(){
  return '<div class="flowbar"><button class="ghost" onclick="back()">← 戻る</button>'
    +'<button class="ghost" onclick="showMenu()">メニュー</button></div>';
}
function cathead(right){
  return '<div class="cathead"><span class="ci">'+cat.icon+'</span><span class="ct">'+cat.title+'</span>'
    +'<span class="step">'+right+'</span></div>';
}

function renderNode(id){
  let node=NODES[id];
  if(node.build){ const r=BUILDERS[node.build](currentCtx()); node={result:true,text:r.text,tone:r.tone}; }
  node.result ? renderResult(node) : renderQuestion(node);
  window.scrollTo(0,0);
}

function renderQuestion(node){
  let html=flowbar()+cathead("質問 "+(answers.length+1));
  html+='<div class="card"><div class="qtext">'+esc(tmpl(node.q))+'</div><div class="options">';
  node.options.forEach(function(o,i){ html+='<button class="opt" onclick="choose('+i+')">'+esc(o.label)+'</button>'; });
  html+='</div></div>';
  view.innerHTML=html;
}

function renderResult(node){
  let html=flowbar()+cathead("対応の目安");
  if(answers.length){
    html+='<ul class="answers">';
    answers.forEach(function(a){ html+='<li><b>'+esc(a.q)+'</b>'+esc(a.a)+'</li>'; });
    html+='</ul>';
  }
  const tone=node.tone||"info";
  html+='<div class="result '+tone+'"><span class="rlead">'+(TONE_LABEL[tone]||"")+'</span>'
    +linkifyPhones(esc(tmpl(node.text)))+'</div>';
  html+='<div class="actions"><button class="btn" onclick="startFlow(menuIndex())">もう一度</button>'
    +'<button class="btn primary" onclick="showMenu()">メニューへ</button></div>';
  view.innerHTML=html;
}

function menuIndex(){ return MENU.indexOf(cat); }

function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

showMenu();
</script>
</body>
</html>
